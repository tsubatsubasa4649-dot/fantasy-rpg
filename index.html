<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>風鳴りの洞窟 | Fantasy RPG</title>
  <style>*{box-sizing:border-box}body{margin:0;background:#12151d;color:#f4eedc;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif}button{font:inherit}.wrap{max-width:520px;margin:auto;padding:14px}h1{font-size:24px;margin:6px 0 10px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}#place{font-weight:700}#status{font-size:13px;min-height:20px}canvas{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated;background:#101018;border:3px solid #d5c29c;border-radius:6px;margin-top:8px}#message,#battle{background:#222b3c;padding:12px;border-radius:8px;margin:10px 0}#message{min-height:72px}.battle-head{margin-bottom:8px}.battle-body{display:flex;gap:12px;align-items:center}#enemy-img{width:96px;height:96px;image-rendering:pixelated;background:rgba(255,255,255,.06);border-radius:6px}.battle-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.battle-menu button,.system button,.pad button{appearance:none;border:none;border-radius:10px;background:#40506d;color:#fff;padding:12px 10px}.battle-menu button:active,.system button:active,.pad button:active{transform:translateY(1px);filter:brightness(.95)}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:12px auto}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.pad .action{grid-column:1 / span 3;background:#736241}.system{display:grid;grid-template-columns:1fr 1fr;gap:8px}.note{font-size:12px;opacity:.8}@media (min-width:540px){#message{min-height:56px}}</style>
</head>
<body>
  <main class="wrap">
    <h1>風鳴りの洞窟</h1>
    <div class="meta">
      <div id="place">始まりの村</div>
      <div id="status"></div>
    </div>

    <canvas id="game" width="320" height="240" aria-label="ゲーム画面"></canvas>
    <p id="message" role="status">十字キーまたは下のボタンで移動。話す/調べるで会話や宿屋休憩。</p>

    <section id="battle" hidden>
      <div class="battle-head">
        <strong id="enemy-name"></strong>
      </div>
      <div class="battle-body">
        <img id="enemy-img" alt="敵" width="96" height="96">
        <p id="battle-msg"></p>
      </div>
      <div id="battle-menu" class="battle-menu"></div>
    </section>

    <div class="pad">
      <button data-dir="up" class="up">▲</button>
      <button data-dir="left" class="left">◀</button>
      <button data-dir="down" class="down">▼</button>
      <button data-dir="right" class="right">▶</button>
      <button id="interact" class="action">話す／調べる</button>
    </div>

    <div class="system">
      <button id="save">セーブ</button>
      <button id="load">ロード</button>
      <button id="music-toggle" aria-pressed="false">♪ BGM オフ</button>
    </div>

    <p class="note">素材を統合済み。ブラウザでそのまま動作確認できます。</p>
  </main>

const imgs={};
for(const [name,file] of Object.entries(files)){
  const img=new Image();
  img.src=file;
  img.onload=()=>render();
  imgs[name]=img;
}
function tell(msg){el('message').textContent=msg;}
function showStats(){
  el('place').textContent=maps[state.map].name;
  el('status').textContent=`Lv.${state.level} HP ${state.hp}/${state.maxHp} MP ${state.mp}/${state.maxMp} EXP ${state.exp} 薬 ${state.potions}`;
}
function cell(m,x,y){return m.rows[y]?.[x] ?? '#';}
function paint(name,x,y,w=TILE,h=TILE){const img=imgs[name];if(img?.complete)ctx.drawImage(img,x,y,w,h);}
function render(){
  const m=maps[state.map];
  ctx.clearRect(0,0,VIEW_W,VIEW_H);
  const maxCamX=Math.max(0,m.rows[0].length-10), maxCamY=Math.max(0,m.rows.length-7);
  const camX=Math.max(0,Math.min(maxCamX,state.x-4));
  const camY=Math.max(0,Math.min(maxCamY,state.y-3));
  const ox=camX*TILE, oy=camY*TILE;
  for(let y=0;y<m.rows.length;y++){
    for(let x=0;x<m.rows[0].length;x++){
      const c=cell(m,x,y), px=x*TILE-ox, py=y*TILE-oy;
      paint('ground',px,py);
      if(c==='#') paint('wall',px,py);
      if(c==='H') paint('house',px,py);
      if(c==='C') paint('cave',px,py);
      if(c==='N') paint('npc',px,py);
    }
  }
  if(m.boss && !state.bossDefeated) paint('guardian',m.boss.x*TILE-ox,m.boss.y*TILE-oy);
  paint('hero',state.x*TILE-ox,state.y*TILE-oy);
  showStats();
}
function warp(to,x,y){state.map=to;state.x=x;state.y=y;tell(maps[to].name+'に入った。');render();}
function move(dx,dy){
  if(enemy) return;
  const m=maps[state.map];
  const x=state.x+dx, y=state.y+dy;
  if(x<0||y<0||x>=m.rows[0].length||y>=m.rows.length) return;
  const exit=m.exits.find(e=>e.x===x && e.y===y);
  if(exit){warp(exit.to,exit.tx,exit.ty);return;}
  if(cell(m,x,y)==='#') return;
  if(m.npc && m.npc.x===x && m.npc.y===y){tell(m.npc.text);return;}
  state.x=x; state.y=y; state.steps++;
  if(m.boss && !state.bossDefeated && m.boss.x===x && m.boss.y===y){battle(true);return;}
  if(state.map!=='village' && state.steps%7===0 && Math.random()<0.65){battle(false);return;}
  render();
}
function interact(){
  if(enemy) return;
  const m=maps[state.map];
  if(m.npc && Math.abs(state.x-m.npc.x)+Math.abs(state.y-m.npc.y)<=1){tell(m.npc.text);return;}
  if(state.map==='village' && Math.abs(state.x-3)+Math.abs(state.y-2)<=1){state.hp=state.maxHp;state.mp=state.maxMp;tell('宿屋で休んだ。HPとMPが全回復した。');render();return;}
  tell('特に何もない。');
}
function battle(isBoss){
  if(window.FantasyMusic && musicEnabled) window.FantasyMusic.start();
  enemy=isBoss?{name:'洞窟の守護者',hp:48,atk:7,exp:20,boss:true,img:'guardian'}:{name:'スライム',hp:15,atk:4,exp:5,boss:false,img:'slime'};
  el('battle').hidden=false;
  el('enemy-name').textContent=enemy.name;
  el('enemy-img').src=imgs[enemy.img].src;
  const menu=el('battle-menu');
  menu.replaceChildren();
  [['攻撃','attack'],['魔法 MP3','magic'],['ポーション','potion'],['逃げる','run']].forEach(([label,action])=>{
    const b=document.createElement('button');b.textContent=label;b.onclick=()=>turn(action);menu.append(b);
  });
  sayBattle(enemy.name+'が現れた！');
}
function sayBattle(s){el('battle-msg').textContent=s;tell(s);}
function endBattle(){enemy=null;el('battle').hidden=true;if(window.FantasyMusic)window.FantasyMusic.stop();render();}
function turn(action){
  if(!enemy) return;
  let s='';
  if(action==='run'){
    if(enemy.boss) s='守護者からは逃げられない！';
    else if(Math.random()<0.75){sayBattle('逃げ切った！');endBattle();return;}
    else s='逃げられなかった！';
  } else if(action==='potion'){
    if(!state.potions){sayBattle('ポーションがない！');return;}
    state.potions--; const heal=Math.min(20,state.maxHp-state.hp); state.hp+=heal; s=`HPを${heal}回復！`;
  } else if(action==='magic'){
    if(state.mp<3){sayBattle('MPが足りない！');return;}
    state.mp-=3; const d=12+Math.floor(Math.random()*5); enemy.hp-=d; s=`ファイア！ ${d}ダメージ！`;
  } else {
    const d=Math.max(1,state.atk+Math.floor(Math.random()*5)-2); enemy.hp-=d; s=`攻撃！ ${d}ダメージ！`;
  }
  if(enemy.hp<=0){
    s+=` ${enemy.name}を倒した！`; state.exp+=enemy.exp;
    if(enemy.boss){state.bossDefeated=true; s+=' 序章クリア！';}
    while(state.exp>=state.level*12){state.exp-=state.level*12; state.level++; state.maxHp+=5; state.maxMp+=2; state.atk+=2; state.hp=state.maxHp; state.mp=state.maxMp; s+=` レベル${state.level}に上がった！`;}
    endBattle(); tell(s); return;
  }
  const dmg=Math.max(1,enemy.atk+Math.floor(Math.random()*3)-1); state.hp-=dmg; s+=` ${enemy.name}の攻撃！ ${dmg}ダメージ。`;
  if(state.hp<=0){state.hp=state.maxHp;state.mp=state.maxMp;endBattle();warp('village',4,6);tell('力尽きた……村で目を覚ました。');return;}
  sayBattle(s); render();
}
function save(){localStorage.setItem('fantasy-rpg-save-v1',JSON.stringify(state)); tell('セーブした。');}
function load(){
  const s=JSON.parse(localStorage.getItem('fantasy-rpg-save-v1')||'null');
  if(!s||!maps[s.map]){tell('セーブデータがない。');return;}
  state={...fresh(),...s}; enemy=null; el('battle').hidden=true; if(window.FantasyMusic)window.FantasyMusic.stop(); render(); tell('ロードした。');
}
let musicEnabled=localStorage.getItem('fantasy-rpg-music')!=='off';
const musicButton=el('music-toggle');
function refreshMusicButton(){musicButton.textContent=musicEnabled?'♪ BGM オン':'♪ BGM オフ';musicButton.setAttribute('aria-pressed',String(musicEnabled));}
refreshMusicButton();
musicButton.addEventListener('click',async()=>{
  musicEnabled=!musicEnabled;
  localStorage.setItem('fantasy-rpg-music',musicEnabled?'on':'off');refreshMusicButton();
  if(!window.FantasyMusic){tell('BGMの読み込みに失敗した。再読み込みしてね。');return;}
  if(musicEnabled){const ok=await window.FantasyMusic.start();if(!ok)tell('この環境では音声を再生できなかった。');}
  else window.FantasyMusic.stop();
});
const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
for(const button of document.querySelectorAll('[data-dir]')){
  let timer=null;
  const step=()=>move(...dirs[button.dataset.dir]);
  button.addEventListener('pointerdown',e=>{e.preventDefault();step(); clearInterval(timer); timer=setInterval(step,165);});
  ['pointerup','pointercancel','pointerleave'].forEach(name=>button.addEventListener(name,()=>clearInterval(timer)));
}
el('interact').onclick=interact; el('save').onclick=save; el('load').onclick=load;
window.addEventListener('keydown',e=>{
  const k={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
  if(k[e.key]){e.preventDefault(); if(!e.repeat) move(...k[e.key]);}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault(); interact();}
});
render();
</script>
