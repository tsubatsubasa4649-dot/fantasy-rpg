name: Build and publish Godot vertical slice

on:
  push:
    paths:
      - "godot/**"
      - "tools/build_audio.py"
      - "tools/patch_hd2d_web.py"
      - ".github/workflows/godot-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Bundle open-license Japanese UI font
        run: |
          curl -fLsS --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf" -o godot/assets/NotoSansJP.ttf
          curl -fLsS --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansjp/OFL.txt" -o godot/assets/NotoSansJP-OFL.txt
          test -s godot/assets/NotoSansJP.ttf
          test -s godot/assets/NotoSansJP-OFL.txt

      - name: Compose original WAV soundtrack
        run: |
          python3 tools/build_audio.py
          test -s godot/audio/field.wav
          test -s godot/audio/cave.wav
          test -s godot/audio/battle.wav
          test -s godot/audio/step.wav
          test -s godot/audio/confirm.wav
          test -s godot/audio/attack.wav
          test -s godot/audio/hit.wav

      - name: Import Godot resources
        run: godot --headless --path godot --import --quit

      - name: Verify data-driven game and combat
        run: |
          echo "START PHASE2"; timeout 35s godot --headless --path godot --script res://tests/test_phase2.gd
          echo "START PHASE3"; timeout 35s godot --headless --path godot --script res://tests/test_phase3.gd
          echo "START VILLAGE"; timeout 35s godot --headless --path godot --script res://tests/test_village.gd
          echo "START UI"; timeout 35s godot --headless --path godot --script res://tests/test_ui_smoke.gd
          echo "START HD2D"; timeout 35s godot --headless --path godot --script res://tests/test_hd2d.gd

      - name: Diagnose Web export templates
        run: |
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f -name "web*.zip" -print || true
          grep -E "^(html/export_icon|progressive_web_app/enabled|variant/thread_support)=" godot/export_presets.cfg

      - name: Export browser build
        run: |
          mkdir -p godot-play
          # Fresh asset basename invalidates Safari's cached .pck/.wasm/.js files.
          godot --headless --verbose --path godot --export-release "Web" "$GITHUB_WORKSPACE/godot-play/fantasy-quest32.html"
          mv godot-play/fantasy-quest32.html godot-play/index.html
          test -s godot-play/index.html
          test -s godot-play/fantasy-quest32.pck
          test -s godot-play/fantasy-quest32.wasm
          grep -q "fantasy-quest32" godot-play/index.html

      - name: Export separate HD-2D browser demo (classic remains default)
        run: |
          cp godot/project.godot godot/project.godot.classic
          sed -i 's#run/main_scene="res://scenes/vertical_slice.tscn"#run/main_scene="res://scenes/hd2d_village.tscn"#' godot/project.godot
          mkdir -p godot-play/hd2d
          # Each build gets unique JS/WASM/PCK names: iPhone Safari must never mix
          # a cached old .pck with a new .wasm or engine script.
          basename="windle-hd2d-${GITHUB_SHA:0:10}"
          godot --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/godot-play/hd2d/${basename}.html"
          mv "godot-play/hd2d/${basename}.html" godot-play/hd2d/index.html
          mv godot/project.godot.classic godot/project.godot
          python3 tools/patch_hd2d_web.py godot-play/hd2d/index.html
          test -s godot-play/hd2d/index.html
          test -s "godot-play/hd2d/${basename}.pck"
          test -s "godot-play/hd2d/${basename}.wasm"
          grep -q "${basename}" godot-play/hd2d/index.html
          grep -q 'hd2d-recovery' godot-play/hd2d/index.html

      - name: Capture running HD-2D 3D village
        run: |
          xvfb-run -a timeout 70s godot --path godot --script res://tests/capture_hd2d.gd
          test -s godot/hd2d-village-screen.png
          cp godot/hd2d-village-screen.png godot-play/hd2d/village-screen.png

      - name: Capture real Godot village screenshot
        run: |
          xvfb-run -a timeout 60s godot --path godot --script res://tests/capture_village.gd
          test -s godot/village-screen.png
          cp godot/village-screen.png godot-play/village-screen.png
          base64 -w0 godot/village-screen.png > godot-play/village-screen.b64
          test -s godot-play/village-screen.b64
          test -s godot/village-plaza-screen.png
          cp godot/village-plaza-screen.png godot-play/village-plaza-screen.png
          base64 -w0 godot/village-plaza-screen.png > godot-play/village-plaza-screen.b64
          test -s godot-play/village-plaza-screen.b64
          test -s godot/village-west-screen.png
          cp godot/village-west-screen.png godot-play/village-west-screen.png
          base64 -w0 godot/village-west-screen.png > godot-play/village-west-screen.b64
          test -s godot-play/village-west-screen.b64
          test -s godot/rpg-menu-screen.png
          test -s godot/rpg-formation-screen.png
          cp godot/rpg-menu-screen.png godot-play/rpg-menu-screen.png
          cp godot/rpg-formation-screen.png godot-play/rpg-formation-screen.png
          base64 -w0 godot/rpg-menu-screen.png > godot-play/rpg-menu-screen.b64
          base64 -w0 godot/rpg-formation-screen.png > godot-play/rpg-formation-screen.b64

      - name: Play through village, overworld and cave, then capture actual screens
        run: |
          xvfb-run -a timeout 180s godot --path godot --script res://tests/playthrough_review.gd | tee playthrough-report.log
          grep -q "PLAYTEST SUMMARY" playthrough-report.log
          mkdir -p godot-play/playtest
          for stage in 01-first-frame 02-first-menu 03-first-dialogue 03a-patrol-flowers 03b-patrol-well 04-ricky-recruited 05-two-companions 05a-forest-traces 06-formation-recruited 07-inn-dialogue 08-after-load 09-world-entry 10-cave-entry 11-slime-choice 12-battle-command 13-battle-result 14-compact-menu 15-compact-formation; do
            test -s "godot/review-${stage}.png"
            cp "godot/review-${stage}.png" "godot-play/playtest/${stage}.png"
            base64 -w0 "godot/review-${stage}.png" > "godot-play/playtest/${stage}.b64"
          done
          cp playthrough-report.log godot-play/playtest/playthrough-report.log

      - name: Upload HD-2D test build on feature branches
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hd2d-village-preview
          path: |
            godot-play/hd2d/
            godot-play/playtest/playthrough-report.log
          if-no-files-found: error

      - name: Commit browser build without touching original HTML game
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot-play/
          if ! git diff --staged --quiet; then
            git commit -m "Build Godot vertical slice [skip ci]"
            # Other documentation/source commits can land while Godot exports.
            # Always rebase onto current main and retry the push without forcing.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            echo "Could not publish built Web files after five attempts."
            exit 1
          fi
